name: pushengage_flutter_sdk
description: PushEngage SDK for Flutter - push notifications (FCM and APNs) and In-App Messaging for Android and iOS apps.

version: 1.1.0
homepage: https://github.com/awesomemotive/pushengage-flutter-sdk
repository: https://github.com/awesomemotive/pushengage-flutter-sdk
topics:
  - push-notifications
  - notifications
  - fcm
  - apns
  - in-app-messaging

environment:
  sdk: ">=3.4.3 <4.0.0"
  flutter: ">=3.22.2"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pushengage.pushengage_flutter_sdk
        pluginClass: PushEngageFlutterSdkPlugin
      ios:
        pluginClass: PushEngageFlutterSdkPlugin
